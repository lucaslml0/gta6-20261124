<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Nights — Steal cars. Drive fast. Rule the night.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Small credit line, pinned to the bottom edge; never intercepts input. */
  #credit { position: fixed; left: 0; right: 0; bottom: 6px; margin: 0; text-align: center;
    font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(255,255,255,0.45);
    pointer-events: none; z-index: 1; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice City Nights: a top-down open-world crime game. Steal cars, outrun the cops, and own the night across three missions."></canvas>
<p id="credit">Vice City Nights — a fan-made open-world crime game in a 3200×2400 canvas city</p>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
